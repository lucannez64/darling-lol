name: dc-codesign

on:
  push:
    paths:
      - "tools/dc-codesign/**"
      - "tests/security/**"
      - "tests/test_security_host.py"
      - "patches/**"
      - ".github/workflows/dc-codesign.yml"
  pull_request:
    paths:
      - "tools/dc-codesign/**"
      - "tests/security/**"
      - "tests/test_security_host.py"
      - "patches/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libssl-dev libxml2-dev pkg-config \
            libclang-rt-18-dev || sudo apt-get install -y -qq clang libssl-dev libxml2-dev pkg-config libfuzzer-14-dev

      - name: Install rcodesign (pinned)
        run: |
          url=https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL -o /tmp/rcodesign.tgz "$url"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  /tmp/rcodesign.tgz" | sha256sum -c -
          tar -xzf /tmp/rcodesign.tgz -C /tmp
          sudo install -m755 /tmp/apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign /usr/local/bin/rcodesign
          rcodesign --version

      - name: Host security policies
        run: python3 -m unittest discover -s tests -p 'test_security_host.py'

      - name: Unit tests (cross-check against rcodesign)
        working-directory: tools/dc-codesign
        run: make test

      - name: Fuzz smoke (30 s, ASan + UBSan)
        working-directory: tools/dc-codesign
        run: ./fuzz/run.sh 30
