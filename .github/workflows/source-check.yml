name: Source package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  nix-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - run: nix build .#checks.x86_64-linux.fonts --no-link -L
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Security host dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-dev pkg-config
      # tests/test_current_appearance_ownership.py links Objective-C with clang's
      # GNU runtime. clang looks for libobjc in the GCC version it selected, so
      # install the matching libobjc rather than a fixed one.
      - name: Objective-C runtime for clang
        run: |
          gcc_dir=$(clang -v 2>&1 | sed -n 's/^Selected GCC installation: //p')
          echo "clang uses GCC in $gcc_dir"
          sudo apt-get install -y -qq "libobjc-$(basename "$gcc_dir")-dev"
          printf '__attribute__((objc_root_class)) @interface A @end\n@implementation A @end\nint main(void) { return 0; }\n' > /tmp/objc-check.m
          clang -fobjc-runtime=gcc /tmp/objc-check.m -lobjc -o /tmp/objc-check
      - name: Require C++ regression compiler
        run: |
          command -v c++
          c++ --version
      - run: python scripts/validate.py
      - run: python tools/riot-input-offline-check.py
      - run: python tools/riot-launcher-offline-check.py
      - run: python tools/riot-runtime-cleanup-offline-check.py
      - run: python tools/riot-cdn-dns-offline-check.py
      # Runs every tests/test_*.py, so new test files cannot be left out of CI.
      - name: Full test suite
        run: python -m unittest discover -s tests
