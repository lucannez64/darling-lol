name: Source package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  nix-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - run: nix build .#checks.x86_64-linux.fonts --no-link -L
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Security host dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-dev pkg-config
      - name: Require C++ regression compiler
        run: |
          command -v c++
          c++ --version
      - run: python scripts/validate.py
      - run: python tools/riot-input-offline-check.py
      - run: python tools/riot-launcher-offline-check.py
      - run: python tools/riot-runtime-cleanup-offline-check.py
      - run: python tools/riot-cdn-dns-offline-check.py
      # Runs every tests/test_*.py, so new test files cannot be left out of CI.
      - name: Full test suite
        run: python -m unittest discover -s tests
