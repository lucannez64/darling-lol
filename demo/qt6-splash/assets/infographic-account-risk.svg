  <text x="112" y="73" fill="#b7a5b2" font-family="DejaVu Sans, sans-serif" font-size="10">Account and platform risk</text>

  <rect x="378" y="28" width="106" height="27" rx="13.5" fill="#3b1719" stroke="#f87171" stroke-width="1"/>
