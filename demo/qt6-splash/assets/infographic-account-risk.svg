<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" width="768" height="768" role="img" aria-labelledby="title desc">
  <title id="title">Darling-lol account suspension risk</title>
  <desc id="desc">Riot does not support this environment. Third-party compatibility tools may violate the Terms of Service. Users have reported temporary suspensions, including before playing a match. There is no guarantee of account safety.</desc>
  <g transform="scale(1.5)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17121a"/>
    </linearGradient>
  </defs>

  <rect width="768" height="768" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="23" fill="none" stroke="#38283a" stroke-width="2"/>

  <g transform="translate(28 22) scale(0.58)" aria-label="Darling Launcher">
    <rect x="8" y="8" width="112" height="112" rx="26" fill="#0f172a"/>
    <path fill-rule="evenodd" fill="#2dd4bf" d="M38 30h20c21 0 34 15 34 34s-13 34-34 34H38V30zm18 18v32h2c9 0 16-7 16-16s-7-16-16-16h-2z"/>
    <rect x="30" y="90" width="68" height="8" rx="4" fill="#818cf8"/>
  </g>

