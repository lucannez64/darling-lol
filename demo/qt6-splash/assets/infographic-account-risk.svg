  <rect x="44" y="342" width="34" height="29" rx="5" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <path d="M44 349h34M55 338v8M67 338v8" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <text x="92" y="353" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700">REPORTED</text>
  <text x="92" y="369" fill="#d8c7d0" font-family="DejaVu Sans, sans-serif" font-size="9">temporary suspensions</text>
