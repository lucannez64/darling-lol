  <rect x="28" y="112" width="456" height="194" rx="16" fill="#1d1519" stroke="#5c3138" stroke-width="1"/>

  <path d="M92 138 L132 207 H52 Z" fill="#3a2410" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round"/>
  <text x="92" y="195" text-anchor="middle" fill="#fbbf24" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="700">!</text>

  <text x="152" y="151" fill="#fca5a5" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">SUSPENSION RISK</text>
