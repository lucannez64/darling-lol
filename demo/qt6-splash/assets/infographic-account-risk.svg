  <text x="328" y="369" fill="#d8c7d0" font-family="DejaVu Sans, sans-serif" font-size="9">account safety</text>
  <text x="288" y="405" fill="#fca5a5" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700">Use at your own risk.</text>

