  <text x="164" y="202" fill="#dbcbd4" font-family="DejaVu Sans, sans-serif" font-size="10">Third-party compatibility tools may violate the Terms of Service.</text>

  <circle cx="154" cy="222" r="3" fill="#fbbf24"/>
  <text x="164" y="226" fill="#dbcbd4" font-family="DejaVu Sans, sans-serif" font-size="10">Users have reported temporary suspensions,</text>
  <text x="164" y="240" fill="#dbcbd4" font-family="DejaVu Sans, sans-serif" font-size="10">including before playing a match.</text>

  <circle cx="154" cy="260" r="3" fill="#f87171"/>
  <text x="164" y="264" fill="#dbcbd4" font-family="DejaVu Sans, sans-serif" font-size="10">No guarantee of account safety. Use at your own risk.</text>

  <text x="152" y="288" fill="#a58b98" font-family="DejaVu Sans, sans-serif" font-size="8">The project does not provide a way to evade detection, DRM or anti-cheat.</text>

