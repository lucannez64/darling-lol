<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" width="768" height="768" role="img" aria-labelledby="title desc">
  <title id="title">Darling-lol does not distribute protected content</title>
  <desc id="desc">The repository does not include Riot client binaries, game assets or account credentials. The official Riot installer obtains the client. The project contains runtime patches and local tools only and does not bypass DRM or anti-cheat.</desc>
  <g transform="scale(1.5)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a2b"/>
    </linearGradient>
  </defs>

  <rect width="768" height="768" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="23" fill="none" stroke="#22324a" stroke-width="2"/>

  <g transform="translate(28 22) scale(0.58)" aria-label="Darling Launcher">
    <rect x="8" y="8" width="112" height="112" rx="26" fill="#0f172a"/>
    <path fill-rule="evenodd" fill="#2dd4bf" d="M38 30h20c21 0 34 15 34 34s-13 34-34 34H38V30zm18 18v32h2c9 0 16-7 16-16s-7-16-16-16h-2z"/>
    <rect x="30" y="90" width="68" height="8" rx="4" fill="#818cf8"/>
  </g>

  <text x="112" y="53" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">Darling-lol</text>
  <text x="112" y="73" fill="#9fb0c7" font-family="DejaVu Sans, sans-serif" font-size="10">What is inside the project</text>

  <rect x="354" y="28" width="130" height="27" rx="13.5" fill="#0e2b25" stroke="#2dd4bf" stroke-width="1"/>
  <text x="419" y="45.5" text-anchor="middle" fill="#5eead4" font-family="DejaVu Sans, sans-serif" font-size="8" font-weight="700" letter-spacing="1">PROTECTED CONTENT</text>

  <text x="28" y="118" fill="#2dd4bf" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" letter-spacing="1.8">WHAT WE DO NOT DISTRIBUTE</text>

  <rect x="28" y="132" width="140" height="158" rx="14" fill="#151d2d" stroke="#30435e"/>
  <text x="54" y="160" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700">RIOT CLIENT</text>
  <text x="54" y="174" fill="#9fb0c7" font-family="DejaVu Sans, sans-serif" font-size="8">binaries &amp; files</text>
  <rect x="66" y="193" width="64" height="43" rx="6" fill="none" stroke="#f87171" stroke-width="2"/>
  <path d="M78 205h40M78 214h28M78 223h20" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
  <path d="M58 250l80-70" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
  <text x="98" y="276" text-anchor="middle" fill="#fca5a5" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700">NOT INCLUDED</text>

  <rect x="186" y="132" width="140" height="158" rx="14" fill="#151d2d" stroke="#30435e"/>
  <text x="212" y="160" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700">GAME ASSETS</text>
  <text x="212" y="174" fill="#9fb0c7" font-family="DejaVu Sans, sans-serif" font-size="8">art, audio &amp; data</text>
  <path d="M220 196h26l8 10h32v37h-66z" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"/>
  <path d="M230 216h44M230 226h30" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <path d="M216 250l80-70" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
  <text x="256" y="276" text-anchor="middle" fill="#fca5a5" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700">NOT INCLUDED</text>

  <rect x="344" y="132" width="140" height="158" rx="14" fill="#151d2d" stroke="#30435e"/>
  <text x="370" y="160" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700">ACCOUNTS</text>
  <text x="370" y="174" fill="#9fb0c7" font-family="DejaVu Sans, sans-serif" font-size="8">tokens &amp; credentials</text>
  <circle cx="410" cy="205" r="14" fill="none" stroke="#818cf8" stroke-width="2"/>
  <path d="M410 218v17m0-8h10m-10 8h7" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M378 250l80-70" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
  <text x="414" y="276" text-anchor="middle" fill="#fca5a5" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700">NOT INCLUDED</text>

  <rect x="28" y="316" width="456" height="126" rx="14" fill="#0f211f" stroke="#22524a"/>
  <circle cx="66" cy="356" r="18" fill="#153b34" stroke="#2dd4bf" stroke-width="2"/>
  <path d="M56 356l7 8 14-18" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="98" y="351" fill="#5eead4" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2">OFFICIAL INSTALLER</text>
  <text x="98" y="370" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700">Riot's installer obtains the client.</text>
  <text x="98" y="388" fill="#b7c8d8" font-family="DejaVu Sans, sans-serif" font-size="10">You install it yourself; this project does not bundle it.</text>
  <text x="98" y="411" fill="#8fa9a3" font-family="DejaVu Sans, sans-serif" font-size="9">Runtime patches and local tools only.</text>
  <text x="98" y="427" fill="#8fa9a3" font-family="DejaVu Sans, sans-serif" font-size="9">No DRM, anti-cheat or telemetry bypass.</text>

  <rect x="28" y="460" width="456" height="28" rx="8" fill="#111b2c" stroke="#26364d"/>
  <text x="42" y="478" fill="#9fb0c7" font-family="DejaVu Sans, sans-serif" font-size="8">No Riot binaries · no game assets · no account credentials</text>

  <text x="28" y="505" fill="#718198" font-family="DejaVu Sans, sans-serif" font-size="7">Unofficial project, not affiliated with Riot Games · GPL-3.0 source</text>
  </g>
</svg>
