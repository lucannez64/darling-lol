<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">League on Linux — a penguin in a circular gold L emblem</title>
  <defs>
    <linearGradient id="rim-edge" gradientUnits="userSpaceOnUse" x1="112" y1="52" x2="390" y2="473">
      <stop offset="0" stop-color="#fff0bd"/>
      <stop offset=".38" stop-color="#b98342"/>
      <stop offset=".72" stop-color="#59371f"/>
      <stop offset="1" stop-color="#c99753"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="134" y1="51" x2="365" y2="453">
      <stop offset="0" stop-color="#fff0bd"/>
      <stop offset=".32" stop-color="#d4a55c"/>
      <stop offset=".61" stop-color="#a46c34"/>
      <stop offset=".83" stop-color="#d6aa64"/>
      <stop offset="1" stop-color="#8c592d"/>
    </linearGradient>
    <linearGradient id="rim-inner" gradientUnits="userSpaceOnUse" x1="171" y1="63" x2="294" y2="450">
      <stop offset="0" stop-color="#694327"/>
      <stop offset=".53" stop-color="#aa783e"/>
      <stop offset="1" stop-color="#f3cd84"/>
    </linearGradient>
    <radialGradient id="enamel" gradientUnits="userSpaceOnUse" cx="277" cy="198" r="260" gradientTransform="matrix(1 0 0 .89 0 22)">
      <stop offset="0" stop-color="#225052"/>
      <stop offset=".55" stop-color="#142c40"/>
      <stop offset="1" stop-color="#090f20"/>
    </radialGradient>
    <linearGradient id="letter" gradientUnits="userSpaceOnUse" x1="166" y1="142" x2="258" y2="393">
      <stop offset="0" stop-color="#f9d588"/>
      <stop offset=".43" stop-color="#c6914b"/>
      <stop offset=".78" stop-color="#ae743a"/>
      <stop offset="1" stop-color="#e2b772"/>
    </linearGradient>
    <linearGradient id="letter-bevel" gradientUnits="userSpaceOnUse" x1="124" y1="142" x2="293" y2="397">
      <stop offset="0" stop-color="#fff0bd"/>
      <stop offset=".50" stop-color="#d29e58"/>
      <stop offset="1" stop-color="#78502e"/>
    </linearGradient>
    <linearGradient id="feathers" gradientUnits="userSpaceOnUse" x1="230" y1="114" x2="335" y2="347">
      <stop offset="0" stop-color="#293745"/>
      <stop offset=".42" stop-color="#121b27"/>
      <stop offset="1" stop-color="#0a1019"/>
    </linearGradient>
    <linearGradient id="feather-rim" gradientUnits="userSpaceOnUse" x1="236" y1="103" x2="322" y2="345">
      <stop offset="0" stop-color="#527779"/>
      <stop offset=".54" stop-color="#294751"/>
      <stop offset="1" stop-color="#131d29"/>
    </linearGradient>
    <linearGradient id="belly" gradientUnits="userSpaceOnUse" x1="253" y1="175" x2="303" y2="344">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".51" stop-color="#f0eee6"/>
      <stop offset="1" stop-color="#b5c9cd"/>
    </linearGradient>
    <linearGradient id="amber" x2=".24" y2="1">
      <stop offset="0" stop-color="#ffd181"/>
      <stop offset=".46" stop-color="#efa34a"/>
      <stop offset="1" stop-color="#b9662b"/>
    </linearGradient>
  </defs>

  <!-- The recessed enamel face and its three metal edges. -->
  <path fill="url(#rim-edge)" d="M256 32a224 224 0 1 1 0 448 224 224 0 1 1 0-448Z"/>
  <path fill="url(#gold)" d="M256 37a219 219 0 1 1 0 438 219 219 0 1 1 0-438Z"/>
  <path fill="url(#rim-inner)" d="M256 50a206 206 0 1 1 0 412 206 206 0 1 1 0-412Z"/>
  <path fill="url(#enamel)" d="M256 56a200 200 0 1 1 0 400 200 200 0 1 1 0-400Z"/>
  <path d="M59 254a197 197 0 0 1 394 0" fill="none" stroke="#67a3a1" stroke-opacity=".22" stroke-width="2"/>

  <!-- The penguin rests on the foot of the L. -->
  <path d="M143 145H185L170 162V354H356L382 341L369 393H116L131 374V159Z"
        fill="#080f1b" stroke="#080f1b" stroke-width="6" stroke-linejoin="round" transform="translate(0 4)"/>
  <path d="M143 145H185L170 162V354H356L382 341L369 393H116L131 374V159Z"
        fill="url(#letter)" stroke="#644023" stroke-width="3" stroke-linejoin="round"/>
  <path d="M143 145H185L170 162V354H356L382 341L372 354L359 363H160V158L166 151H145L140 162V377L134 384L116 393L131 374V159Z"
