  <path d="M249 216C263 226 292 231 317 214C306 232 271 241 245 225Z" fill="#66838a" opacity=".24"/>

  <path d="M253 182C256 177 262 175 268 178C273 181 272 185 269 188
           C263 193 254 189 253 182Z
           M301 176C304 171 310 169 316 172C321 175 320 179 316 182
           C311 186 302 183 301 176Z" fill="#101821"/>
  <path d="M267 180a2.3 2.3 0 1 1-4.6 0 2.3 2.3 0 1 1 4.6 0Z
           M315 174a2.3 2.3 0 1 1-4.6 0 2.3 2.3 0 1 1 4.6 0Z" fill="#fffaf0"/>

  <path d="M272 196C280 186 289 183 299 187C310 191 318 196 326 196
           C320 202 308 210 296 214C286 217 277 213 271 207C268 204 269 199 272 196Z"
        fill="#b7682c" stroke="#673820" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M272 196C280 186 289 183 299 187C310 191 318 196 326 196
           C308 199 289 208 270 204Z" fill="url(#amber)"/>
  <path d="M270 204C289 208 308 199 326 196" fill="none" stroke="#794123" stroke-width="2" stroke-linecap="round"/>
</svg>
