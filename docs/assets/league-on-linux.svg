  <path d="M134 384H362L372 354L382 341L369 393H116Z" fill="#714828" opacity=".57"/>
  <path d="M135 384H362M160 363H356L372 354" fill="none" stroke="#ffe0a1" stroke-opacity=".63" stroke-width="2"/>

