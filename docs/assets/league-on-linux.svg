  <path d="M237 181C242 163 259 151 271 156C281 159 284 170 286 176
           C297 160 310 151 321 155C339 161 341 183 331 199
           C324 210 317 214 317 225C317 235 326 244 332 259
           C344 287 336 311 321 327C311 338 295 344 279 344
           C251 344 229 332 222 309C213 281 227 255 242 236
           C251 224 254 217 248 208C240 200 234 192 237 181Z"
