  <path d="M224 352Q232 345 240 345M238 355Q244 349 252 348M337 352Q329 345 321 345M323 355Q317 349 309 348"
        fill="none" stroke="#925024" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M232 215C221 198 219 173 228 151C238 126 261 112 288 111
           C317 110 340 125 349 149C357 171 350 195 338 212
           C344 227 356 243 365 263C375 284 379 302 375 319
           C372 331 364 332 357 323L342 307
           C334 335 313 352 280 353C247 354 223 340 213 315
           L199 328C191 334 184 328 185 318C186 286 200 256 216 237
           C223 229 229 222 232 215Z"
