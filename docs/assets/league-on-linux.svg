  <path d="M257 327C244 327 229 333 219 341C213 345 211 351 217 355C228 363 252 361 267 356C273 354 274 347 272 341Z
           M304 327C317 327 332 333 342 341C348 345 350 351 344 355C333 363 309 361 294 356C288 354 287 347 289 341Z"
